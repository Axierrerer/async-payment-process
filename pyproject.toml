[project]
name = "async-payment-process"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "faststream[rabbit]>=0.7.8",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "punq>=0.9.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"
markers = ["integration: requires Docker (Testcontainers)"]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle: базовый стиль
    "F",         # pyflakes: неиспользуемые импорты/переменные, неопределённые имена
    "I",         # isort: сортировка импортов
    "UP",        # pyupgrade: list[int] вместо List[int], X | None вместо Optional
    "B",         # bugbear: мутабельные аргументы по умолчанию, except без raise from и т.д.
    "SIM",       # упрощения: лишние if/else, вложенные with
    "C4",        # лучшие comprehensions
    "ASYNC",     # ошибки в async: блокирующие вызовы (time.sleep, requests) внутри async def
    "PT",        # стиль pytest
    "RUF",       # правила самого ruff
]
ignore = [
    "E501",      # длину строки контролирует форматер
    "B008",      # вызов функции в аргументах по умолчанию: ломает FastAPI Depends(...)
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"**/migrations/env.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
explicit_package_bases = true

